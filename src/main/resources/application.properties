spring.application.name=tema-cart

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/tema_cart_db
spring.datasource.username=root
spring.datasource.password=Intexcloud5

# JPA and Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# Server Configuration
server.port=8080

# JWT Configuration
jwt.secret=TemaCartSuperSecretKeyForJwtTokenGenerationMustBeAtLeast256BitsLong2024
jwt.expiration=86400000


spring.jackson.serialization.write-dates-as-timestamps=false


